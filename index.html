<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vdeapps, applications Android</title>
<style>
  :root { --encre:#1f1a17; --papier:#fbf6ec; --carte:#fff; --tomate:#b8361f; --safran:#f2a516; --trait:#e4dccb; --doux:#5a514b; }
  @media (prefers-color-scheme: dark) {
    :root { --encre:#f4ede2; --papier:#1b1714; --carte:#26211d; --tomate:#ff8a70; --trait:#3d3530; --doux:#c9bfb3; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--papier); color:var(--encre); font:18px/1.6 Figtree, system-ui, sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:3rem 1rem 4rem; }
  h1 { font:800 2.4rem/1.1 "Bricolage Grotesque", Figtree, system-ui, sans-serif; margin:0 0 1.5rem; }
  a.appli { display:block; background:var(--carte); border:1px solid var(--trait); border-radius:16px; padding:1rem 1.25rem; color:var(--encre); text-decoration:none; }
  a.appli strong { font-size:1.3rem; color:var(--tomate); }
  :focus-visible { outline:3px solid var(--safran); outline-offset:2px; }
  .doux { color:var(--doux); font-size:.95rem; margin-top:2rem; }
  .doux a { color:var(--tomate); }
</style>
</head>
<body>
<main>
  <h1>vdeapps</h1>
  <a class="appli" href="mijote/"><strong>Mijote</strong><br>Un carnet de recettes simple, pensé pour la cuisine de tous les jours.</a>
  <p class="doux">Applications éditées par un particulier, à titre non professionnel. Contact : <a href="mailto:vdeapps@gmail.com">vdeapps@gmail.com</a></p>
</main>
</body>
</html>
